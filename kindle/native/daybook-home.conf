description "Daybook Home priority and setup-card cleanup"
start on framework_ready
stop on stopping framework
task
script
    sleep 20
    for pass in 1 2 3 4; do
        if [ -f /mnt/us/kindle-daybook/pin-home.sh ]; then
            sh /mnt/us/kindle-daybook/pin-home.sh >/dev/null 2>&1 || true
        fi
        sleep 10
    done
end script
